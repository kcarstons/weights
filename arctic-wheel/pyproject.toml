[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "build"
]
build-backend = "setuptools.build_meta"


[project]
name = "snowflake-arctic-embed-m-v1-5"
version = "1.0.0"
requires-python = ">=3.12,<3.13"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
snowflake_arctic_embed_m_v1_5 = [
    "model/**/*"
]
